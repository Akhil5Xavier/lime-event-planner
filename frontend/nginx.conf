# Password guessing protection: 5 login attempts per minute per client IP (small burst allowed).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# AI assistant: 10 questions per minute per IP, protecting the free model quota.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Requests arrive through Caddy; take the client IP from X-Forwarded-For set by a private-network proxy,
    # so rate limiting applies per user rather than to Caddy's single IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. Keep add_header out of the location blocks below: a location with its own
    # add_header drops all of these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_lime;
        proxy_read_timeout 60s;
    }

    # One answer can take several model round trips, so allow longer than other API calls.
    location = /api/chat {
        limit_req zone=chat burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_lime;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_lime;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        # File names contain a content hash, so they can be cached for a long time.
        expires 1y;
    }

    # Single-page app: let React Router handle unknown paths. Never cache index.html,
    # so users get the new asset names right after a deploy.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
