name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock pytest
      - run: python -m pytest -q
      # Migrations must apply cleanly to an empty database.
      - run: python -m app.cli init-db
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build  # includes the TypeScript typecheck

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for the stack
        run: |
          {
            echo "DOMAIN=localhost"
            echo "POSTGRES_PASSWORD=ci-password"
            echo "JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for healthy services
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through Caddy (HTTPS, local certificate)
        run: |
          curl -fsSk https://localhost/api/health
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
